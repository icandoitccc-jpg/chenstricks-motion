name: Render

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'jobs/ 下的任务名（如 spec-demo）；与 specJson 二选一'
        required: false
        default: ''
      specJson:
        description: '完整 AnimSpec JSON 字符串（App 云端渲染通道）；提供时优先于 job'
        required: false
        default: ''
      note:
        description: '备注（可选）'
        required: false
        default: ''
  push:
    branches: [main]
    # 注意：不要再加 'public/**'。App 渲染前会把图片临时推进 public/uploads/，
    # 一旦纳入 paths，每次生成视频都会额外触发 2 个无用渲染任务，白烧 Actions 分钟。
    # （云端渲染一律走 workflow_dispatch + specJson，不依赖 push 触发）
    paths:
      - 'src/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # push 触发时跑矩阵里的验证任务；workflow_dispatch 带 specJson 时走单任务
        job: ${{ github.event_name == 'push' && fromJSON('[{"j":"spec-demo"},{"j":"spec-demo-a"}]') || fromJSON('[{"j":"dispatch"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 决定本次渲染任务
        id: decide
        env:
          SPEC_JSON: ${{ inputs.specJson }}
          JOB_INPUT: ${{ inputs.job }}
        run: |
          if [ -n "$SPEC_JSON" ]; then
            echo "jobname=dispatch" >> "$GITHUB_OUTPUT"
          elif [ -n "$JOB_INPUT" ]; then
            echo "jobname=$JOB_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "jobname=${{ matrix.job.j }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 写入动态 spec（App 通道）
        if: steps.decide.outputs.jobname == 'dispatch'
        env:
          SPEC_JSON: ${{ inputs.specJson }}
        run: |
          mkdir -p jobs
          printf '%s' "$SPEC_JSON" > jobs/dispatch.json
          node -e "const j=require('./jobs/dispatch.json'); if(!j.spec) throw new Error('dispatch.json 必须包含 spec 字段'); console.log('spec OK, elements:', j.spec.elements.length, 'actions:', j.spec.actions.length)"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 补齐 headless 浏览器系统库（失败不阻断，运行器通常已自带）
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y libnss3 libgbm1 libatk1.0-0 libatk-bridge2.0-0 libxkbcommon0 libasound2 \
            || sudo apt-get install -y libnss3 libgbm1 || true

      - name: 下载渲染用浏览器
        run: npx remotion browser ensure

      - name: 渲染 ${{ steps.decide.outputs.jobname }}
        env:
          JOB: ${{ steps.decide.outputs.jobname }}
        run: |
          mkdir -p out/${{ steps.decide.outputs.jobname }}
          node scripts/render.mjs 2>&1 | tee out/${{ steps.decide.outputs.jobname }}/render.log

      - name: 统计本任务消耗
        if: always()
        run: echo "本任务墙钟 ${SECONDS}s，按 GitHub 计费向上取整 ≈ $(( SECONDS / 60 + 1 )) Actions 分钟"

      - name: 上传产物（含失败日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ steps.decide.outputs.jobname }}-${{ github.run_id }}
          path: out/${{ steps.decide.outputs.jobname }}
          retention-days: 2
